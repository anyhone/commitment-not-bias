[project]
name = "monitor-gated-steering"
version = "0.1.0"
description = "Monitor-gated vs always-on activation steering for fairness (CAA vs FairSteer)"
requires-python = ">=3.10,<3.11"
dependencies = [
    # torch build cu126 (CUDA 12.x driver)
    "torch==2.7.1",
    "transformers==5.8.1",
    "accelerate==1.13.0",
    "bitsandbytes==0.49.2",
    "datasets==4.8.5",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "scikit-learn==1.7.2",
    "safetensors==0.7.0",
    "tokenizers==0.22.2",
    "pyyaml",
    "pytest",
    "matplotlib",
    "tqdm",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
